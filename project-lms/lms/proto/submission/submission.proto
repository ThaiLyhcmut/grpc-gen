syntax = "proto3";

package submission;

option go_package = "github.com/thaily/lms/proto/submission";

import "google/protobuf/timestamp.proto";
import "proto/common/common.proto";

// =====================================================================
// 1. ExamAttempt
// =====================================================================
message ExamAttempt {
  uint64 id = 1;
  uint64 exam_id = 2;
  uint64 student_id = 3;
  optional uint64 assignment_id = 4;
  google.protobuf.Timestamp started_at = 5;
  optional google.protobuf.Timestamp submitted_at = 6;
  optional double auto_score = 7;
  optional double manual_score = 8;
  optional double total_score = 9;
  AttemptStatus status = 10;
  optional uint64 graded_by_teacher_id = 11;
  optional google.protobuf.Timestamp graded_at = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
  optional string created_by = 15;
  optional string updated_by = 16;
}

enum AttemptStatus {
  ATTEMPT_STATUS_UNSPECIFIED = 0;
  IN_PROGRESS = 1;
  SUBMITTED = 2;
  GRADED = 3;
}

message CreateExamAttemptRequest {
  optional uint64 id = 1;
  uint64 exam_id = 2;
  uint64 student_id = 3;
  optional uint64 assignment_id = 4;
  google.protobuf.Timestamp started_at = 5;
  optional google.protobuf.Timestamp submitted_at = 6;
  optional double auto_score = 7;
  optional double manual_score = 8;
  optional double total_score = 9;
  AttemptStatus status = 10;
  optional uint64 graded_by_teacher_id = 11;
  optional google.protobuf.Timestamp graded_at = 12;
  string created_by = 13;
}
message CreateExamAttemptResponse { ExamAttempt exam_attempt = 1; }

message UpdateExamAttemptRequest {
  repeated common.FilterCriteria filters = 1;
  optional google.protobuf.Timestamp submitted_at = 2;
  optional double auto_score = 3;
  optional double manual_score = 4;
  optional double total_score = 5;
  optional AttemptStatus status = 6;
  optional uint64 graded_by_teacher_id = 7;
  optional google.protobuf.Timestamp graded_at = 8;
  string updated_by = 9;
}
message UpdateExamAttemptResponse { repeated ExamAttempt exam_attempt = 1; int32 affected_count = 2; }

message DeleteExamAttemptRequest { repeated common.FilterCriteria filters = 1; }
message DeleteExamAttemptResponse { int32 affected_count = 1; }

message ListExamAttemptRequest { common.SearchRequest search = 1; }
message ListExamAttemptResponse { repeated ExamAttempt exam_attempt = 1; int32 total = 2; int32 page = 3; int32 page_size = 4; }

// =====================================================================
// 2. AttemptAnswer
// =====================================================================
message AttemptAnswer {
  uint64 id = 1;
  uint64 attempt_id = 2;
  uint64 question_id = 3;
  optional string selected_choice_ids = 4;     // JSON-as-string
  optional string text_answer = 5;
  optional string uploaded_file_key = 6;
  optional double auto_score = 7;
  optional double manual_score = 8;
  optional string teacher_comment = 9;
  optional google.protobuf.Timestamp graded_at = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  optional string created_by = 13;
  optional string updated_by = 14;
}

message CreateAttemptAnswerRequest {
  optional uint64 id = 1;
  uint64 attempt_id = 2;
  uint64 question_id = 3;
  optional string selected_choice_ids = 4;
  optional string text_answer = 5;
  optional string uploaded_file_key = 6;
  optional double auto_score = 7;
  optional double manual_score = 8;
  optional string teacher_comment = 9;
  optional google.protobuf.Timestamp graded_at = 10;
  string created_by = 11;
}
message CreateAttemptAnswerResponse { AttemptAnswer attempt_answer = 1; }

message UpdateAttemptAnswerRequest {
  repeated common.FilterCriteria filters = 1;
  optional string selected_choice_ids = 2;
  optional string text_answer = 3;
  optional string uploaded_file_key = 4;
  optional double auto_score = 5;
  optional double manual_score = 6;
  optional string teacher_comment = 7;
  optional google.protobuf.Timestamp graded_at = 8;
  string updated_by = 9;
}
message UpdateAttemptAnswerResponse { repeated AttemptAnswer attempt_answer = 1; int32 affected_count = 2; }

message DeleteAttemptAnswerRequest { repeated common.FilterCriteria filters = 1; }
message DeleteAttemptAnswerResponse { int32 affected_count = 1; }

message ListAttemptAnswerRequest { common.SearchRequest search = 1; }
message ListAttemptAnswerResponse { repeated AttemptAnswer attempt_answer = 1; int32 total = 2; int32 page = 3; int32 page_size = 4; }

// =====================================================================
// Service
// =====================================================================
service SubmissionService {
  rpc CreateExamAttempt(CreateExamAttemptRequest) returns (CreateExamAttemptResponse);
  rpc UpdateExamAttempt(UpdateExamAttemptRequest) returns (UpdateExamAttemptResponse);
  rpc DeleteExamAttempt(DeleteExamAttemptRequest) returns (DeleteExamAttemptResponse);
  rpc ListExamAttempt(ListExamAttemptRequest) returns (ListExamAttemptResponse);

  rpc CreateAttemptAnswer(CreateAttemptAnswerRequest) returns (CreateAttemptAnswerResponse);
  rpc UpdateAttemptAnswer(UpdateAttemptAnswerRequest) returns (UpdateAttemptAnswerResponse);
  rpc DeleteAttemptAnswer(DeleteAttemptAnswerRequest) returns (DeleteAttemptAnswerResponse);
  rpc ListAttemptAnswer(ListAttemptAnswerRequest) returns (ListAttemptAnswerResponse);
}
