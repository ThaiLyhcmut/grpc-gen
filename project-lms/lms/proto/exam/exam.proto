syntax = "proto3";

package exam;

option go_package = "github.com/thaily/lms/proto/exam";

import "google/protobuf/timestamp.proto";
import "proto/common/common.proto";

// =====================================================================
// 1. Exam
// =====================================================================
message Exam {
  uint64 id = 1;
  uint64 owner_teacher_id = 2;
  string title = 3;
  optional string description = 4;
  optional string subject = 5;
  int32 duration_min = 6;
  double total_points = 7;
  ExamVisibility visibility = 8;
  optional ExamCommunityStatus community_status = 9;
  optional string reject_reason = 10;
  bool shuffle_questions = 11;
  bool shuffle_choices = 12;
  ShowResultMode show_result_mode = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
  optional string created_by = 16;
  optional string updated_by = 17;
}

enum ExamVisibility {
  EXAM_VISIBILITY_UNSPECIFIED = 0;
  EXAM_CLASS = 1;
  EXAM_COMMUNITY = 2;
}

enum ExamCommunityStatus {
  EXAM_COMMUNITY_STATUS_UNSPECIFIED = 0;
  EXAM_DRAFT = 1;
  EXAM_PENDING = 2;
  EXAM_APPROVED = 3;
  EXAM_REJECTED = 4;
}

enum ShowResultMode {
  SHOW_RESULT_MODE_UNSPECIFIED = 0;
  IMMEDIATELY = 1;
  AFTER_CLOSE = 2;
  MANUAL = 3;
}

message CreateExamRequest {
  optional uint64 id = 1;
  uint64 owner_teacher_id = 2;
  string title = 3;
  optional string description = 4;
  optional string subject = 5;
  int32 duration_min = 6;
  double total_points = 7;
  ExamVisibility visibility = 8;
  optional ExamCommunityStatus community_status = 9;
  optional string reject_reason = 10;
  bool shuffle_questions = 11;
  bool shuffle_choices = 12;
  ShowResultMode show_result_mode = 13;
  string created_by = 14;
}
message CreateExamResponse { Exam exam = 1; }

message UpdateExamRequest {
  repeated common.FilterCriteria filters = 1;
  optional string title = 2;
  optional string description = 3;
  optional string subject = 4;
  optional int32 duration_min = 5;
  optional double total_points = 6;
  optional ExamVisibility visibility = 7;
  optional ExamCommunityStatus community_status = 8;
  optional string reject_reason = 9;
  optional bool shuffle_questions = 10;
  optional bool shuffle_choices = 11;
  optional ShowResultMode show_result_mode = 12;
  string updated_by = 13;
}
message UpdateExamResponse { repeated Exam exam = 1; int32 affected_count = 2; }

message DeleteExamRequest { repeated common.FilterCriteria filters = 1; }
message DeleteExamResponse { int32 affected_count = 1; }

message ListExamRequest { common.SearchRequest search = 1; }
message ListExamResponse { repeated Exam exam = 1; int32 total = 2; int32 page = 3; int32 page_size = 4; }

// =====================================================================
// 2. ExamAssignment
// =====================================================================
message ExamAssignment {
  uint64 id = 1;
  uint64 exam_id = 2;
  uint64 class_id = 3;
  google.protobuf.Timestamp open_at = 4;
  google.protobuf.Timestamp close_at = 5;
  uint32 max_attempts = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  optional string created_by = 9;
  optional string updated_by = 10;
}

message CreateExamAssignmentRequest {
  optional uint64 id = 1;
  uint64 exam_id = 2;
  uint64 class_id = 3;
  google.protobuf.Timestamp open_at = 4;
  google.protobuf.Timestamp close_at = 5;
  uint32 max_attempts = 6;
  string created_by = 7;
}
message CreateExamAssignmentResponse { ExamAssignment exam_assignment = 1; }

message UpdateExamAssignmentRequest {
  repeated common.FilterCriteria filters = 1;
  optional google.protobuf.Timestamp open_at = 2;
  optional google.protobuf.Timestamp close_at = 3;
  optional uint32 max_attempts = 4;
  string updated_by = 5;
}
message UpdateExamAssignmentResponse { repeated ExamAssignment exam_assignment = 1; int32 affected_count = 2; }

message DeleteExamAssignmentRequest { repeated common.FilterCriteria filters = 1; }
message DeleteExamAssignmentResponse { int32 affected_count = 1; }

message ListExamAssignmentRequest { common.SearchRequest search = 1; }
message ListExamAssignmentResponse { repeated ExamAssignment exam_assignment = 1; int32 total = 2; int32 page = 3; int32 page_size = 4; }

// =====================================================================
// 3. Question
// =====================================================================
message Question {
  uint64 id = 1;
  uint64 exam_id = 2;
  int32 position = 3;
  QuestionType type = 4;
  string content = 5;
  optional string image_key = 6;
  double points = 7;
  optional string explanation = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  optional string created_by = 11;
  optional string updated_by = 12;
}

enum QuestionType {
  QUESTION_TYPE_UNSPECIFIED = 0;
  SINGLE = 1;
  MULTIPLE = 2;
  SHORT_ANSWER = 3;
  ESSAY = 4;
}

message CreateQuestionRequest {
  optional uint64 id = 1;
  uint64 exam_id = 2;
  int32 position = 3;
  QuestionType type = 4;
  string content = 5;
  optional string image_key = 6;
  double points = 7;
  optional string explanation = 8;
  string created_by = 9;
}
message CreateQuestionResponse { Question question = 1; }

message UpdateQuestionRequest {
  repeated common.FilterCriteria filters = 1;
  optional int32 position = 2;
  optional QuestionType type = 3;
  optional string content = 4;
  optional string image_key = 5;
  optional double points = 6;
  optional string explanation = 7;
  string updated_by = 8;
}
message UpdateQuestionResponse { repeated Question question = 1; int32 affected_count = 2; }

message DeleteQuestionRequest { repeated common.FilterCriteria filters = 1; }
message DeleteQuestionResponse { int32 affected_count = 1; }

message ListQuestionRequest { common.SearchRequest search = 1; }
message ListQuestionResponse { repeated Question question = 1; int32 total = 2; int32 page = 3; int32 page_size = 4; }

// =====================================================================
// 4. QuestionChoice
// =====================================================================
message QuestionChoice {
  uint64 id = 1;
  uint64 question_id = 2;
  int32 position = 3;
  string content = 4;
  bool is_correct = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  optional string created_by = 8;
  optional string updated_by = 9;
}

message CreateQuestionChoiceRequest {
  optional uint64 id = 1;
  uint64 question_id = 2;
  int32 position = 3;
  string content = 4;
  bool is_correct = 5;
  string created_by = 6;
}
message CreateQuestionChoiceResponse { QuestionChoice question_choice = 1; }

message UpdateQuestionChoiceRequest {
  repeated common.FilterCriteria filters = 1;
  optional int32 position = 2;
  optional string content = 3;
  optional bool is_correct = 4;
  string updated_by = 5;
}
message UpdateQuestionChoiceResponse { repeated QuestionChoice question_choice = 1; int32 affected_count = 2; }

message DeleteQuestionChoiceRequest { repeated common.FilterCriteria filters = 1; }
message DeleteQuestionChoiceResponse { int32 affected_count = 1; }

message ListQuestionChoiceRequest { common.SearchRequest search = 1; }
message ListQuestionChoiceResponse { repeated QuestionChoice question_choice = 1; int32 total = 2; int32 page = 3; int32 page_size = 4; }

// =====================================================================
// 5. QuestionAnswer
// =====================================================================
message QuestionAnswer {
  uint64 id = 1;
  uint64 question_id = 2;
  string accepted_answer = 3;
  bool case_sensitive = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  optional string created_by = 7;
  optional string updated_by = 8;
}

message CreateQuestionAnswerRequest {
  optional uint64 id = 1;
  uint64 question_id = 2;
  string accepted_answer = 3;
  bool case_sensitive = 4;
  string created_by = 5;
}
message CreateQuestionAnswerResponse { QuestionAnswer question_answer = 1; }

message UpdateQuestionAnswerRequest {
  repeated common.FilterCriteria filters = 1;
  optional string accepted_answer = 2;
  optional bool case_sensitive = 3;
  string updated_by = 4;
}
message UpdateQuestionAnswerResponse { repeated QuestionAnswer question_answer = 1; int32 affected_count = 2; }

message DeleteQuestionAnswerRequest { repeated common.FilterCriteria filters = 1; }
message DeleteQuestionAnswerResponse { int32 affected_count = 1; }

message ListQuestionAnswerRequest { common.SearchRequest search = 1; }
message ListQuestionAnswerResponse { repeated QuestionAnswer question_answer = 1; int32 total = 2; int32 page = 3; int32 page_size = 4; }

// =====================================================================
// Service
// =====================================================================
service ExamService {
  rpc CreateExam(CreateExamRequest) returns (CreateExamResponse);
  rpc UpdateExam(UpdateExamRequest) returns (UpdateExamResponse);
  rpc DeleteExam(DeleteExamRequest) returns (DeleteExamResponse);
  rpc ListExam(ListExamRequest) returns (ListExamResponse);

  rpc CreateExamAssignment(CreateExamAssignmentRequest) returns (CreateExamAssignmentResponse);
  rpc UpdateExamAssignment(UpdateExamAssignmentRequest) returns (UpdateExamAssignmentResponse);
  rpc DeleteExamAssignment(DeleteExamAssignmentRequest) returns (DeleteExamAssignmentResponse);
  rpc ListExamAssignment(ListExamAssignmentRequest) returns (ListExamAssignmentResponse);

  rpc CreateQuestion(CreateQuestionRequest) returns (CreateQuestionResponse);
  rpc UpdateQuestion(UpdateQuestionRequest) returns (UpdateQuestionResponse);
  rpc DeleteQuestion(DeleteQuestionRequest) returns (DeleteQuestionResponse);
  rpc ListQuestion(ListQuestionRequest) returns (ListQuestionResponse);

  rpc CreateQuestionChoice(CreateQuestionChoiceRequest) returns (CreateQuestionChoiceResponse);
  rpc UpdateQuestionChoice(UpdateQuestionChoiceRequest) returns (UpdateQuestionChoiceResponse);
  rpc DeleteQuestionChoice(DeleteQuestionChoiceRequest) returns (DeleteQuestionChoiceResponse);
  rpc ListQuestionChoice(ListQuestionChoiceRequest) returns (ListQuestionChoiceResponse);

  rpc CreateQuestionAnswer(CreateQuestionAnswerRequest) returns (CreateQuestionAnswerResponse);
  rpc UpdateQuestionAnswer(UpdateQuestionAnswerRequest) returns (UpdateQuestionAnswerResponse);
  rpc DeleteQuestionAnswer(DeleteQuestionAnswerRequest) returns (DeleteQuestionAnswerResponse);
  rpc ListQuestionAnswer(ListQuestionAnswerRequest) returns (ListQuestionAnswerResponse);
}
