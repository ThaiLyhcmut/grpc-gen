syntax = "proto3";

package notification;

option go_package = "github.com/thaily/lms/proto/notification";

import "google/protobuf/timestamp.proto";
import "proto/common/common.proto";

// =====================================================================
// 1. Notification
// =====================================================================
message Notification {
  uint64 id = 1;
  uint64 user_id = 2;
  string type = 3;
  string title = 4;
  optional string body = 5;
  optional string payload = 6;            // JSON-as-string
  optional google.protobuf.Timestamp read_at = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  optional string created_by = 10;
  optional string updated_by = 11;
}

message CreateNotificationRequest {
  optional uint64 id = 1;
  uint64 user_id = 2;
  string type = 3;
  string title = 4;
  optional string body = 5;
  optional string payload = 6;
  optional google.protobuf.Timestamp read_at = 7;
  string created_by = 8;
}
message CreateNotificationResponse { Notification notification = 1; }

message UpdateNotificationRequest {
  repeated common.FilterCriteria filters = 1;
  optional google.protobuf.Timestamp read_at = 2;
  string updated_by = 3;
}
message UpdateNotificationResponse { repeated Notification notification = 1; int32 affected_count = 2; }

message DeleteNotificationRequest { repeated common.FilterCriteria filters = 1; }
message DeleteNotificationResponse { int32 affected_count = 1; }

message ListNotificationRequest { common.SearchRequest search = 1; }
message ListNotificationResponse { repeated Notification notification = 1; int32 total = 2; int32 page = 3; int32 page_size = 4; }

// =====================================================================
// 2. CommunityReport
// =====================================================================
message CommunityReport {
  uint64 id = 1;
  uint64 reporter_user_id = 2;
  ReportTargetType target_type = 3;
  uint64 target_id = 4;
  string reason = 5;
  optional string note = 6;
  ReportStatus status = 7;
  optional uint64 resolved_by_admin_id = 8;
  optional google.protobuf.Timestamp resolved_at = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  optional string created_by = 12;
  optional string updated_by = 13;
}

enum ReportTargetType {
  REPORT_TARGET_TYPE_UNSPECIFIED = 0;
  TGT_MATERIAL = 1;
  TGT_EXAM = 2;
}

enum ReportStatus {
  REPORT_STATUS_UNSPECIFIED = 0;
  RPT_OPEN = 1;
  RPT_DISMISSED = 2;
  RPT_ACTIONED = 3;
}

message CreateCommunityReportRequest {
  optional uint64 id = 1;
  uint64 reporter_user_id = 2;
  ReportTargetType target_type = 3;
  uint64 target_id = 4;
  string reason = 5;
  optional string note = 6;
  ReportStatus status = 7;
  optional uint64 resolved_by_admin_id = 8;
  optional google.protobuf.Timestamp resolved_at = 9;
  string created_by = 10;
}
message CreateCommunityReportResponse { CommunityReport community_report = 1; }

message UpdateCommunityReportRequest {
  repeated common.FilterCriteria filters = 1;
  optional ReportStatus status = 2;
  optional uint64 resolved_by_admin_id = 3;
  optional google.protobuf.Timestamp resolved_at = 4;
  string updated_by = 5;
}
message UpdateCommunityReportResponse { repeated CommunityReport community_report = 1; int32 affected_count = 2; }

message DeleteCommunityReportRequest { repeated common.FilterCriteria filters = 1; }
message DeleteCommunityReportResponse { int32 affected_count = 1; }

message ListCommunityReportRequest { common.SearchRequest search = 1; }
message ListCommunityReportResponse { repeated CommunityReport community_report = 1; int32 total = 2; int32 page = 3; int32 page_size = 4; }

// =====================================================================
// Service
// =====================================================================
service NotificationService {
  rpc CreateNotification(CreateNotificationRequest) returns (CreateNotificationResponse);
  rpc UpdateNotification(UpdateNotificationRequest) returns (UpdateNotificationResponse);
  rpc DeleteNotification(DeleteNotificationRequest) returns (DeleteNotificationResponse);
  rpc ListNotification(ListNotificationRequest) returns (ListNotificationResponse);

  rpc CreateCommunityReport(CreateCommunityReportRequest) returns (CreateCommunityReportResponse);
  rpc UpdateCommunityReport(UpdateCommunityReportRequest) returns (UpdateCommunityReportResponse);
  rpc DeleteCommunityReport(DeleteCommunityReportRequest) returns (DeleteCommunityReportResponse);
  rpc ListCommunityReport(ListCommunityReportRequest) returns (ListCommunityReportResponse);
}
