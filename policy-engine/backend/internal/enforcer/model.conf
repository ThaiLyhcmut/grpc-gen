[request_definition]
r = sub, obj, act, ctx

[policy_definition]
p = sub, obj, act, condition

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = (g(r.sub, p.sub) || r.sub == p.sub || p.sub == "*") \
    && (r.obj == p.obj || p.obj == "*") \
    && (r.act == p.act || p.act == "*") \
    && evalCondition(r.ctx, p.condition)
